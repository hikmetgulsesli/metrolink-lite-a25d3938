<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MetroLink Lite - Gameplay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#005fae",
                        "inverse-primary": "#c6c6c9",
                        "secondary-fixed-dim": "#a5c8ff",
                        "on-secondary-fixed": "#001c3a",
                        "primary-fixed-dim": "#c6c6c9",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "tertiary-fixed-dim": "#ffb4a9",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1e",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdad5",
                        "outline": "#75777a",
                        "surface-container-low": "#f3f4f6",
                        "surface": "#f8f9fb",
                        "surface-tint": "#5d5e61",
                        "surface-container-high": "#e7e8ea",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#44474a",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9fb",
                        "on-tertiary-fixed-variant": "#930002",
                        "background": "#f8f9fb",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#fb3426",
                        "on-secondary-fixed-variant": "#004785",
                        "surface-dim": "#d9dadc",
                        "on-primary": "#ffffff",
                        "primary": "#000101",
                        "inverse-on-surface": "#f0f1f3",
                        "secondary-container": "#51a0ff",
                        "surface-container": "#edeef0",
                        "primary-container": "#1a1c1e",
                        "outline-variant": "#c5c6ca",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#1a1c1e",
                        "surface-variant": "#e1e2e4",
                        "on-primary-container": "#838486",
                        "primary-fixed": "#e2e2e5",
                        "secondary-fixed": "#d4e3ff",
                        "surface-container-highest": "#e1e2e4",
                        "tertiary": "#040000",
                        "tertiary-container": "#420000",
                        "on-primary-fixed-variant": "#454749",
                        "on-secondary-container": "#003666",
                        "on-tertiary-fixed": "#410000",
                        "on-background": "#191c1e"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "hud-padding": "16px",
                        "container-margin": "24px",
                        "tile-gap": "4px",
                        "base": "8px"
                    },
                    fontFamily: {
                        "display-lg": ["Montserrat", "sans-serif"],
                        "headline-md": ["Montserrat", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "headline-sm": ["Montserrat", "sans-serif"],
                        "headline-lg-mobile": ["Montserrat", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-lg-mobile": ["32px", { lineHeight: "40px", fontWeight: "700" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.08em", fontWeight: "700" }]
                    },
                    boxShadow: {
                        'tile-base': '0 2px 0 0 rgba(0, 1, 1, 0.1)',
                        'tile-active': '0 8px 16px -4px rgba(0, 1, 1, 0.15)',
                        'tray': 'inset 0 4px 6px -1px rgba(0, 1, 1, 0.05)'
                    }
                }
            }
        };
    </script>
<style>
        .tile {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }
        .tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(0, 1, 1, 0.15);
        }
        .tile:active {
            transform: translateY(0);
            box-shadow: 0 2px 0 0 rgba(0, 1, 1, 0.1);
        }
        .rotated-90 { transform: rotate(90deg); }
        .rotated-180 { transform: rotate(180deg); }
        .rotated-270 { transform: rotate(270deg); }
        
        .pulse-timer {
            animation: pulse-border 1.5s infinite;
        }
        
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(251, 52, 38, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(251, 52, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 52, 38, 0); }
        }

        .line-glow-blue { filter: drop-shadow(0 0 6px rgba(0, 95, 174, 0.6)); }
        .line-glow-red { filter: drop-shadow(0 0 6px rgba(186, 26, 26, 0.6)); }
        .line-glow-green { filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.6)); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm docked full-width top-0 z-50">
<div class="flex justify-between items-center w-full px-hud-padding py-2 max-w-full">
<div class="flex items-center gap-4">
<div class="font-display-lg text-headline-md text-primary tracking-tight">MetroLink Lite</div>
<div class="h-6 w-px bg-outline-variant"></div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">LEVEL 4</span>
<span class="font-headline-sm text-headline-sm text-primary">Central Junction</span>
</div>
</div>
<div class="flex items-center gap-8">
<div class="flex flex-col items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant">SCORE</span>
<span class="font-headline-sm text-headline-sm text-primary">1,250</span>
</div>
<div class="relative w-12 h-12 rounded-full border-4 border-on-tertiary-container flex items-center justify-center pulse-timer bg-surface-container-lowest">
<span class="font-headline-sm text-headline-sm text-on-tertiary-container">09</span>
</div>
<div class="flex gap-2">
<button class="w-10 h-10 rounded bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors shadow-tile-base active:translate-y-0.5 active:shadow-none" title="Refresh">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
</button>
<button class="h-10 px-4 rounded bg-primary text-on-primary flex items-center justify-center gap-2 hover:bg-primary-container transition-colors shadow-tile-base active:translate-y-0.5 active:shadow-none" title="Pause">
<span class="material-symbols-outlined" data-icon="pause">pause</span>
<span class="font-body-md text-body-md">Pause</span>
<span class="font-label-caps text-label-caps opacity-70 ml-2">ESC</span>
</button>
<button class="w-10 h-10 rounded bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors shadow-tile-base active:translate-y-0.5 active:shadow-none hidden" title="Settings">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</div>
</div>
</header>
<!-- Main Gameplay Area -->
<main class="flex-grow flex items-center justify-center p-8 bg-surface-container-lowest">
<!-- Playfield Container -->
<div class="bg-surface-container-low p-6 rounded-xl shadow-tray">
<!-- 8x8 Grid -->
<div class="grid grid-cols-8 grid-rows-8 gap-tile-gap w-[600px] h-[600px]" id="playfield">
<!-- Tile Gen Script for demonstration -->
<script>
                    const grid = document.getElementById('playfield');
                    const types = ['straight', 'curve', 't-junction', 'cross', 'station-start', 'station-end', 'empty'];
                    const colors = ['#005fae', '#ba1a1a', '#22c55e']; // blue, red, green
                    
                    for(let i=0; i<64; i++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile bg-surface-container-lowest rounded cursor-pointer flex items-center justify-center shadow-tile-base relative overflow-hidden';
                        
                        // Deterministic somewhat layout for visual demo
                        if (i === 18) { // Station Start Blue
                            tile.innerHTML = `<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center z-10"><span class="text-on-secondary font-headline-sm">A</span></div><div class="absolute right-0 top-1/2 -translate-y-1/2 w-1/2 h-2 bg-secondary line-glow-blue"></div>`;
                            tile.classList.add('cursor-default');
                        } else if (i === 45) { // Station End Red
                            tile.innerHTML = `<div class="w-8 h-8 rounded-full border-4 border-error flex items-center justify-center z-10 bg-surface-container-lowest"><span class="text-error font-headline-sm">B</span></div><div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-2 bg-error"></div>`;
                            tile.classList.add('cursor-default');
                        } else if (i === 19 || i === 20) { // Straight connected blue
                            tile.innerHTML = `<div class="w-full h-2 bg-secondary absolute top-1/2 -translate-y-1/2 line-glow-blue"></div>`;
                        } else if (i === 21) { // Curve connected blue
                            tile.innerHTML = `<div class="w-1/2 h-1/2 absolute left-0 top-1/2 border-t-8 border-r-8 border-secondary rounded-tr-lg border-opacity-100" style="margin-top:-4px; margin-left:0px;"></div>`;
                            tile.classList.add('line-glow-blue');
                        } else if (i % 7 === 0) { // Curve Unconnected
                             tile.innerHTML = `<div class="w-1/2 h-1/2 absolute left-0 top-1/2 border-t-8 border-r-8 border-outline-variant rounded-tr-lg border-opacity-100" style="margin-top:-4px; margin-left:0px;"></div>`;
                             tile.onclick = function() { rotateTile(this); }
                        } else if (i % 5 === 0) { // T-Junction
                             tile.innerHTML = `<div class="w-full h-2 bg-outline-variant absolute top-1/2 -translate-y-1/2"></div><div class="w-2 h-1/2 bg-outline-variant absolute bottom-0 left-1/2 -translate-x-1/2"></div>`;
                             tile.onclick = function() { rotateTile(this); }
                        } else if (i % 3 === 0) { // Straight Unconnected
                            tile.innerHTML = `<div class="w-full h-2 bg-outline-variant absolute top-1/2 -translate-y-1/2"></div>`;
                            tile.onclick = function() { rotateTile(this); }
                        } else {
                            // Emptyish or basic curve
                            tile.innerHTML = `<div class="w-1/2 h-1/2 absolute top-0 right-0 border-b-8 border-l-8 border-outline-variant rounded-bl-lg border-opacity-100" style="margin-top:0px; margin-right:0px;"></div>`;
                            tile.onclick = function() { rotateTile(this); }
                        }

                        grid.appendChild(tile);
                    }

                    function rotateTile(element) {
                        let currentRotation = element.getAttribute('data-rotation') || 0;
                        currentRotation = (parseInt(currentRotation) + 90) % 360;
                        element.setAttribute('data-rotation', currentRotation);
                        element.style.transform = `rotate(${currentRotation}deg)`;
                    }
                </script>
</div>
</div>
</main>
<!-- Bottom Status Bar -->
<footer class="bg-surface-container border-t border-outline-variant py-4 px-container-margin w-full flex items-center justify-between">
<div class="flex items-center gap-4 w-1/2">
<span class="font-label-caps text-label-caps text-on-surface-variant w-48">CONNECTION EFFICIENCY</span>
<div class="flex-grow h-2 bg-surface-variant rounded-full overflow-hidden flex">
<div class="h-full bg-secondary w-1/3"></div>
<div class="h-full bg-error w-1/4"></div>
</div>
<span class="font-headline-sm text-headline-sm text-primary">58%</span>
</div>
<div class="font-body-md text-body-md text-on-surface-variant">
            Routes Active: 1 / 3
        </div>
</footer>
</body></html>
